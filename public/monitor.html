<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unslop Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f4f6; --surface: #fff; --line: rgba(21, 24, 33, .09);
      --ink: #151821; --ink-2: #3d4350; --ink-3: #5f6776;
      --accent: #2448c9; --over: #c62a20; --ok: #1d8a58; --amber: #a86a00;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Anuphan', system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--bg); display: grid; grid-template-columns: 420px 1fr; }
    aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
    header { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
    .row { display: flex; align-items: center; gap: 8px; }
    .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
    .live.stale { background: var(--ink-3); }
    .title { font-weight: 600; font-size: 16px; }
    .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-left: auto; }
    .phase { margin-top: 12px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
    .passes { display: flex; gap: 4px; margin-top: 12px; }
    .passes i { flex: 1; height: 4px; border-radius: 2px; background: #e4e7ec; transition: background-color 300ms var(--ease); }
    .passes i.on { background: var(--ink); }
    .passes i.now { background: var(--accent); }
    .counts { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--ink-3); }
    .counts b { font-family: var(--mono); font-weight: 500; color: var(--ink); margin-right: 4px; }
    .scroll { overflow-y: auto; flex: 1; min-height: 0; }
    section { padding: 16px 20px; border-bottom: 1px solid var(--line); }
    h2 { font-size: 13px; font-weight: 600; color: var(--ink-3); margin: 0 0 8px; }
    .dir { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
    .group { font-size: 12.5px; color: var(--ink-3); margin: 12px 0 4px; }
    .group:first-of-type { margin-top: 0; }
    .f { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 6px 0; align-items: start; }
    .f .s { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; border: 1.5px solid var(--over); transition: background-color 300ms var(--ease), border-color 300ms var(--ease); }
    .f.fixing .s { border-color: var(--accent); background: var(--accent); }
    .f.fixed .s { border-color: var(--ok); background: var(--ok); }
    .f.kept .s { border-color: var(--ink-3); background: transparent; border-style: dashed; }
    .f .sign { color: var(--ink); }
    .f.fixed .sign { color: var(--ink-3); text-decoration: line-through; text-decoration-color: rgba(21, 24, 33, .3); }
    .f .where { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); word-break: break-all; }
    .f .note { font-size: 12.5px; color: var(--ink-2); }
    .f.flash { animation: flash 1.2s var(--ease); }
    @keyframes flash { from { background: #e9eefc; } }
    .log { font-family: var(--mono); font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
    .log div { display: grid; grid-template-columns: 64px 1fr; gap: 8px; color: var(--ink-2); }
    .log time { color: var(--ink-3); }
    .log .phase-l { color: var(--accent); }
    .log .fixed-l { color: var(--ok); }
    .log .file { color: var(--ink-3); }
    .empty { color: var(--ink-3); font-size: 13px; }
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .bar a, .bar button { font: inherit; font-size: 13px; border: 1px solid rgba(21, 24, 33, .16); background: var(--surface); color: var(--ink); border-radius: 8px; height: 32px; padding: 0 12px; display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; transition: background-color 150ms ease, transform 140ms var(--ease); }
    .bar a:hover, .bar button:hover { background: #eef0f3; }
    .bar button:active { transform: scale(0.97); }
    .bar button[aria-pressed='true'] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .bar .url { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-right: auto; }
    .frame { flex: 1; min-height: 0; display: grid; place-items: start center; overflow: auto; padding: 16px; }
    iframe { border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; height: 100%; box-shadow: 0 8px 24px -12px rgba(21, 24, 33, .25); }
    .frame.phone iframe { width: 390px; height: 844px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <aside>
    <header>
      <div class="row"><span class="live" id="live" aria-hidden="true"></span><span class="title" id="title">Unslop Monitor</span><span class="meta" id="ago">-</span></div>
      <div class="phase" id="phase">รอเริ่ม</div>
      <div class="passes" id="passes" aria-hidden="true"></div>
      <div class="counts"><span><b id="c-open">0</b>ยังไม่แก้</span><span><b id="c-fixing">0</b>กำลังแก้</span><span><b id="c-fixed">0</b>แก้แล้ว</span></div>
    </header>
    <div class="scroll">
      <section id="dir-sec" hidden><h2>ทิศทาง</h2><ul class="dir" id="dir"></ul></section>
      <section><h2>จุดที่ดูเป็น AI</h2><div id="findings"><p class="empty">ยังไม่มีผลตรวจ</p></div></section>
      <section><h2>บันทึกการทำงาน</h2><div class="log" id="log"></div></section>
    </div>
  </aside>
  <main>
    <div class="bar">
      <span class="url" id="url">/</span>
      <button type="button" data-v="/#today" aria-pressed="true">วันนี้</button>
      <button type="button" data-v="/#adr">ติดตาม ADR</button>
      <button type="button" data-v="/#lab">แล็บ</button>
      <button type="button" data-v="/#calendar">ปฏิทิน</button>
      <button type="button" data-v="/#dashboard">สรุป</button>
      <button type="button" id="phone" aria-pressed="false">มือถือ</button>
      <a href="/" target="_blank" rel="noopener">เปิดแอป</a>
    </div>
    <div class="frame" id="frame"><iframe id="app" src="/#today" title="แอปที่กำลังแก้"></iframe></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let last = 0, prev = {};

    async function poll() {
      try {
        const r = await fetch('/unslop-monitor.json?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) render(await r.json());
      } catch { /* server restarting */ }
      const age = last ? Math.round((Date.now() - last) / 1000) : null;
      $('ago').textContent = age == null ? '-' : age < 60 ? `อัปเดต ${age} วิ` : `อัปเดต ${Math.round(age / 60)} นาที`;
      $('live').classList.toggle('stale', age == null || age > 120);
    }

    function render(s) {
      if (s.updated === last) return;
      last = s.updated;
      $('title').textContent = s.title || 'Unslop Monitor';
      $('phase').textContent = s.phase;
      $('passes').innerHTML = Array.from({ length: s.passTotal || 9 }, (_, i) =>
        `<i class="${i + 1 < s.pass ? 'on' : i + 1 === s.pass ? 'now' : ''}"></i>`).join('');
      const n = (k) => s.findings.filter((f) => f.status === k).length;
      $('c-open').textContent = n('open'); $('c-fixing').textContent = n('fixing'); $('c-fixed').textContent = n('fixed');

      $('dir-sec').hidden = !s.direction.length;
      $('dir').innerHTML = s.direction.map((l) => `<li>${esc(l)}</li>`).join('');

      const groups = [...new Set(s.findings.map((f) => f.group))];
      $('findings').innerHTML = s.findings.length ? groups.map((g) =>
        `<div class="group">${esc(g)}</div>` + s.findings.filter((f) => f.group === g).map((f) => {
          const changed = prev[f.id] && prev[f.id] !== f.status;
          return `<div class="f ${f.status}${changed ? ' flash' : ''}"><span class="s" title="${esc(f.status)}"></span><div><div class="sign">${esc(f.sign)}</div><div class="where">${esc(f.where)}</div>${f.note ? `<div class="note">${esc(f.note)}</div>` : ''}</div></div>`;
        }).join('')).join('') : '<p class="empty">ยังไม่มีผลตรวจ</p>';
      prev = Object.fromEntries(s.findings.map((f) => [f.id, f.status]));

      $('log').innerHTML = s.log.slice(0, 80).map((l) =>
        `<div><time>${esc(l.t)}</time><span class="${l.kind === 'phase' ? 'phase-l' : l.kind === 'fixed' ? 'fixed-l' : ''}">${esc(l.msg)}${l.file ? ` <span class="file">${esc(l.file)}</span>` : ''}</span></div>`).join('');
    }

    document.querySelectorAll('.bar button[data-v]').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('.bar button[data-v]').forEach((x) => x.setAttribute('aria-pressed', x === b));
      $('app').src = b.dataset.v; $('url').textContent = b.dataset.v;
    }));
    $('phone').addEventListener('click', (e) => {
      const on = $('frame').classList.toggle('phone'); e.currentTarget.setAttribute('aria-pressed', on);
    });
    poll(); setInterval(poll, 1000);
  </script>
</body>
</html>
